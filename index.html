
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <title>CA Marks Calculator</title>

  <style>
    body {
      background-color: #f8f9fa;
    }

    .progress {
      height: 32px;
      border-radius: 16px;
      overflow: hidden;
    }

    .progress-bar {
      transition: width 0.6s ease, background-color 0.6s ease;
      font-weight: 600;
    }

    .card {
      border-radius: 1rem;
    }

    .assessment-card input {
      font-size: 0.9rem;
    }

    .assessment-weight {
      font-size: 0.85rem;
      color: #6c757d;
    }
  </style>
</head>

<body class="p-4">

  <div class="container">

    <h3 class="mb-4 text-center fw-bold text-primary">
      CA Marks Calculator
    </h3>

    <form id="caForm" autocomplete="off">

      <!-- Student and Course -->
      <div class="row mb-3">

        <div class="col-md-6">
          <label for="studentName" class="form-label">
            Student Name
          </label>

          <input
            type="text"
            id="studentName"
            class="form-control"
            placeholder="Enter Student Name"
            required
          >
        </div>

        <div class="col-md-6">
          <label for="courseName" class="form-label">
            Course Name
          </label>

          <select id="courseName" class="form-select" required>

            <option value="">
              Select Course
            </option>

            <option value="CUS411S">
              Computer User Skills (CUS411S)
            </option>

            <option value="ICT521S">
              Information Competence (ICT521S)
            </option>

          </select>
        </div>

      </div>

      <!-- Assessments -->
      <div id="assessments" class="row g-3 mb-4"></div>

    </form>

    <!-- Result Section -->
    <div id="resultSection" class="card p-4 shadow-sm">

      <h5 class="text-center fw-bold mb-3">
        Final CA Result
      </h5>

      <div class="progress">

        <div
          id="caProgress"
          class="progress-bar"
          style="width: 0%"
        >
          0%
        </div>

      </div>

      <p
        id="statusText"
        class="text-center mt-3 fw-semibold"
      >
        Please select a course and enter marks.
      </p>

    </div>

    <!-- Summary -->
    <div id="summary" class="mt-4"></div>

    <!-- PDF Button -->
    <!--
    <div class="text-center mt-4">
      <button id="downloadPDF" class="btn btn-success px-4">
        Download PDF
      </button>
    </div>
    -->

  </div>


  <script>

    /*
     * ============================================================
     * COURSE CONFIGURATION
     * ============================================================
     */

    const courseAssessments = {

      CUS411S: [
        {
          name: "Test 1",
          weight: 35
        },
        {
          name: "Test 2",
          weight: 35
        },
        {
          name: "Assignment 1",
          weight: 20
        },
        {
          name: "Assignment 2",
          weight: 10
        }
      ],

      ICT521S: [
        {
          name: "Test 1",
          weight: 35
        },
        {
          name: "Test 2",
          weight: 35
        },
        {
          name: "Quiz",
          weight: 15
        },
        {
          name: "Assignment 1",
          weight: 15
        }
      ]

    };


    /*
     * ============================================================
     * COURSE NAMES
     * ============================================================
     */

    const courseNames = {

      CUS411S: "Computer User Skills (CUS411S)",

      ICT521S: "Information Competence (ICT521S)"

    };


    /*
     * ============================================================
     * ELEMENT REFERENCES
     * ============================================================
     */

    const assessmentsDiv =
      document.getElementById("assessments");

    const caProgress =
      document.getElementById("caProgress");

    const statusText =
      document.getElementById("statusText");

    const summaryDiv =
      document.getElementById("summary");

    const studentNameInput =
      document.getElementById("studentName");

    const courseNameInput =
      document.getElementById("courseName");

    const downloadPDF =
      document.getElementById("downloadPDF");


    /*
     * ============================================================
     * GENERATE ASSESSMENTS
     * ============================================================
     */

    function generateAssessments() {

      assessmentsDiv.innerHTML = "";

      const course = courseNameInput.value;

      if (!course || !courseAssessments[course]) {

        statusText.textContent =
          "Please select a course.";

        caProgress.style.width = "0%";
        caProgress.textContent = "0%";
        caProgress.className = "progress-bar";

        summaryDiv.innerHTML = "";

        return;
      }


      const assessments =
        courseAssessments[course];


      assessments.forEach((assessment, index) => {

        const col =
          document.createElement("div");

        col.classList.add("col-md-6");


        col.innerHTML = `

          <div class="card p-3 shadow-sm assessment-card">

            <div class="d-flex justify-content-between align-items-center mb-2">

              <h6 class="fw-bold mb-0">
                ${assessment.name}
              </h6>

              <span class="assessment-weight">
                Weight: ${assessment.weight}%
              </span>

            </div>

            <input
              type="number"
              class="form-control mark-input"
              name="markObtained${index}"
              placeholder="Enter mark (%)"
              min="0"
              max="100"
              step="0.01"
            >

            <input
              type="hidden"
              class="weight-input"
              name="weight${index}"
              value="${assessment.weight}"
            >

          </div>

        `;


        assessmentsDiv.appendChild(col);

      });


      attachAutoUpdate();

      calculateCA();

    }


    /*
     * ============================================================
     * ATTACH AUTO UPDATE EVENTS
     * ============================================================
     */

    function attachAutoUpdate() {

      document
        .querySelectorAll(
          ".mark-input, #studentName, #courseName"
        )
        .forEach(input => {

          input.addEventListener(
            "input",
            calculateCA
          );

          input.addEventListener(
            "change",
            calculateCA
          );

        });

    }


    /*
     * ============================================================
     * CALCULATE CA
     * ============================================================
     */

    function calculateCA() {

      const course =
        courseNameInput.value;


      if (!course || !courseAssessments[course]) {

        return;

      }


      const assessments =
        courseAssessments[course];


      let totalCA = 0;

      let details = [];


      assessments.forEach((assessment, index) => {

        const markInput =
          document.querySelector(
            `[name="markObtained${index}"]`
          );


        const mark =
          markInput &&
          markInput.value !== ""
            ? parseFloat(markInput.value)
            : 0;


        const weight =
          assessment.weight;


        /*
         * Weighted contribution
         *
         * Example:
         *
         * Mark = 80
         * Weight = 35
         *
         * Contribution =
         *
         * 80 × 35 / 100
         *
         * = 28%
         */

        const weighted =
          (mark * weight) / 100;


        totalCA += weighted;


        details.push({

          name: assessment.name,

          mark: mark,

          weight: weight,

          weighted: weighted

        });

      });


      /*
       * ============================================================
       * PASS / FAIL
       * ============================================================
       *
       * Pass mark = 50%
       */

      let color = "bg-danger";

      let status = "Fail";

      let statusDescription =
        "Below the pass mark of 50%.";


      if (totalCA >= 80) {

        color = "bg-success";

        status = "Distinction";

        statusDescription =
          "Excellent performance.";

      }

      else if (totalCA >= 70) {

        color = "bg-success";

        status = "Very Good";

        statusDescription =
          "Very good performance.";

      }

      else if (totalCA >= 60) {

        color = "bg-success";

        status = "Good";

        statusDescription =
          "Good performance.";

      }

      else if (totalCA >= 50) {

        color = "bg-warning text-dark";

        status = "Pass";

        statusDescription =
          "Student has achieved the required pass mark.";

      }


      /*
       * ============================================================
       * UPDATE PROGRESS BAR
       * ============================================================
       */

      caProgress.style.width =
        `${Math.min(totalCA, 100).toFixed(2)}%`;

      caProgress.textContent =
        `${totalCA.toFixed(2)}%`;

      caProgress.className =
        `progress-bar ${color}`;


      /*
       * ============================================================
       * UPDATE STATUS
       * ============================================================
       */

      statusText.textContent =
        `${status} — ${statusDescription}`;


      /*
       * ============================================================
       * UPDATE SUMMARY
       * ============================================================
       */

      summaryDiv.innerHTML = `

        <div class="card p-3 mt-3 shadow-sm">

          <h6 class="fw-bold mb-3">
            Course Summary
          </h6>

          <p>
            <strong>Student:</strong>
            ${studentNameInput.value || "N/A"}
          </p>

          <p>
            <strong>Course:</strong>
            ${courseNames[course]}
          </p>

          <hr>

          <ul class="list-group">

            ${details.map(d => `

              <li
                class="list-group-item
                       d-flex
                       justify-content-between
                       align-items-center"
              >

                <span>
                  <strong>${d.name}</strong>
                  <br>

                  <small class="text-muted">
                    ${d.mark}% × ${d.weight}%
                  </small>
                </span>

                <span class="fw-bold">
                  ${d.weighted.toFixed(2)}%
                </span>

              </li>

            `).join("")}

          </ul>


          <div class="mt-3 text-end">

            <div class="fw-bold">
              Final CA Mark:
              ${totalCA.toFixed(2)}%
            </div>

            <div class="mt-1">

              <strong>Status:</strong>

              <span class="${
                totalCA >= 50
                  ? "text-success"
                  : "text-danger"
              }">

                ${status}

              </span>

            </div>

          </div>

        </div>

      `;

    }


    /*
     * ============================================================
     * COURSE CHANGE
     * ============================================================
     */

    courseNameInput.addEventListener(
      "change",
      generateAssessments
    );


    /*
     * ============================================================
     * STUDENT NAME CHANGE
     * ============================================================
     */

    studentNameInput.addEventListener(
      "input",
      calculateCA
    );


    /*
     * ============================================================
     * INITIAL STATE
     * ============================================================
     */

    generateAssessments();


    /*
     * ============================================================
     * PDF GENERATION
     * ============================================================
     *
     * Uncomment the PDF button in the HTML if required.
     * ============================================================
     */

    if (downloadPDF) {

      downloadPDF.addEventListener(
        "click",
        () => {

          calculateCA();


          const student =
            studentNameInput.value || "Student";


          const course =
            courseNames[courseNameInput.value] || "Course";


          const element =
            document.createElement("div");


          element.innerHTML = `

            <div
              style="
                font-family: Arial;
                padding: 40px;
              "
            >

              <h2 style="text-align:center;">
                CA Marks Report
              </h2>

              <p>
                <strong>Student Name:</strong>
                ${student}
              </p>

              <p>
                <strong>Course Name:</strong>
                ${course}
              </p>

              <hr>

              ${summaryDiv.innerHTML}

              <div
                style="
                  margin-top:20px;
                  text-align:center;
                "
              >

                <h3>
                  Final Continuous Assessment:
                  ${caProgress.textContent}
                </h3>

                <p>
                  ${statusText.textContent}
                </p>

              </div>

            </div>

          `;


          html2pdf()
            .set({

              margin: 0.5,

              filename:
                `${student}_${course}_CA_Report.pdf`,

              html2canvas: {
                scale: 2
              },

              jsPDF: {
                orientation: "portrait"
              }

            })
            .from(element)
            .save();

        });

    }

  </script>

</body>

</html>
