<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <title>CA Marks Calculator</title>
  <style>
    body {
      background-color: #f8f9fa;
    }

    .progress {
      height: 32px;
      border-radius: 16px;
      overflow: hidden;
    }

    .progress-bar {
      transition: width 0.6s ease, background-color 0.6s ease;
      font-weight: 600;
    }

    .card {
      border-radius: 1rem;
    }

    .assessment-card input {
      font-size: 0.9rem;
    }
  </style>
</head>

<body class="p-4">
  <div class="container">
    <h3 class="mb-4 text-center fw-bold text-primary">CA Marks Calculator</h3>

    <form id="caForm" autocomplete="off">
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="studentName" class="form-label">Student Name</label>
          <input type="text" id="studentName" class="form-control" placeholder="Enter Student Name" required>
        </div>
        <div class="col-md-6">
          <label for="courseName" class="form-label">Course Name</label>
          <input type="text" id="courseName" class="form-control" placeholder="Enter Course Name" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label for="numAssessments" class="form-label">Number of Assessments</label>
          <select id="numAssessments" class="form-select">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
          </select>
        </div>
      </div>

      <div id="assessments" class="row g-3 mb-4"></div>
    </form>

    <div id="resultSection" class="card p-4 shadow-sm">
      <h5 class="text-center fw-bold mb-3">Final CA Result</h5>
      <div class="progress">
        <div id="caProgress" class="progress-bar" style="width: 0%">0%</div>
      </div>
      <p id="statusText" class="text-center mt-3 fw-semibold"></p>
    </div>

    <div id="summary" class="mt-4"></div>

   <!--  <div class="text-center mt-4">
      <button id="downloadPDF" class="btn btn-success px-4">Download PDF</button>
    </div> -->
  </div>

  <script>
    const numAssessments = document.getElementById('numAssessments');
    const assessmentsDiv = document.getElementById('assessments');
    const caProgress = document.getElementById('caProgress');
    const statusText = document.getElementById('statusText');
    const summaryDiv = document.getElementById('summary');
    const downloadPDF = document.getElementById('downloadPDF');
    const studentNameInput = document.getElementById('studentName');
    const courseNameInput = document.getElementById('courseName');

    function generateAssessments() {
      assessmentsDiv.innerHTML = '';
      const count = parseInt(numAssessments.value);
      for (let i = 1; i <= count; i++) {
        const col = document.createElement('div');
        col.classList.add('col-md-6');
        col.innerHTML = `
          <div class="card p-3 shadow-sm assessment-card">
            <h6 class="fw-bold mb-2">Assessment ${i}</h6>
            <input type="text" class="form-control mb-2" name="assessmentName${i}" placeholder="Assessment ${i} Name">
            <input type="number" class="form-control mb-2 mark-input" name="markObtained${i}" placeholder="Mark Obtained (%)" min="0" max="100">
            <input type="number" class="form-control weight-input" name="weight${i}" placeholder="Weight (%)" min="0" max="100">
          </div>`;
        assessmentsDiv.appendChild(col);
      }
      attachAutoUpdate();
    }

    function attachAutoUpdate() {
      document.querySelectorAll('.mark-input, .weight-input, #studentName, #courseName').forEach(input => {
        input.addEventListener('input', calculateCA);
      });
    }

    function calculateCA() {
      const count = parseInt(numAssessments.value);
      let totalCA = 0;
      let totalWeight = 0;
      let details = [];

      for (let i = 1; i <= count; i++) {
        const name = document.querySelector(`[name="assessmentName${i}"]`)?.value || `Assessment ${i}`;
        const mark = parseFloat(document.querySelector(`[name="markObtained${i}"]`)?.value) || 0;
        const weight = parseFloat(document.querySelector(`[name="weight${i}"]`)?.value) || 0;
        const weighted = (mark * weight) / 100;
        totalCA += weighted;
        totalWeight += weight;
        details.push({ name, mark, weight, weighted });
      }

      const normalizedCA = totalWeight > 0 ? (totalCA / totalWeight) * 100 : 0;
      let color = 'bg-danger';
      let status = 'Fail (Below 40%)';

      if (normalizedCA >= 60) {
        color = 'bg-success';
        status = 'Excellent (60% and above)';
      } else if (normalizedCA >= 40) {
        color = 'bg-warning text-dark';
        status = 'Pass (Between 40% and 59%)';
      }

      if (totalWeight !== 100) {
        status = `⚠️ Total weight is ${totalWeight}%. Should equal 100%.`;
        color = 'bg-secondary';
      }

      caProgress.style.width = `${normalizedCA.toFixed(2)}%`;
      caProgress.textContent = `${normalizedCA.toFixed(2)}%`;
      caProgress.className = `progress-bar ${color}`;
      statusText.textContent = status;

      summaryDiv.innerHTML = `
        <div class="card p-3 mt-3 shadow-sm">
          <h6 class="fw-bold mb-2">Course Summary</h6>
          <p><strong>Student:</strong> ${studentNameInput.value || 'N/A'}</p>
          <p><strong>Course:</strong> ${courseNameInput.value || 'N/A'}</p>
          <ul class="list-group">
            ${details.map(d => `
              <li class="list-group-item d-flex justify-content-between align-items-center">
                ${d.name} — <span>${d.mark}% × ${d.weight}% = ${(d.weighted).toFixed(2)}%</span>
              </li>
            `).join('')}
          </ul>
          <div class="mt-3 fw-bold text-end">Total Weighted Score: ${totalCA.toFixed(2)}%</div>
        </div>
      `;
    }

    numAssessments.addEventListener('change', generateAssessments);
    generateAssessments();

    downloadPDF.addEventListener('click', () => {
      calculateCA(); // ensure up-to-date
      const student = studentNameInput.value || "Student";
      const course = courseNameInput.value || "Course";
      const element = document.createElement('div');

      element.innerHTML = `
        <div style="font-family: Arial; padding: 40px;">
          <h2 style="text-align:center;">CA Marks Report</h2>
          <p><strong>Student Name:</strong> ${student}</p>
          <p><strong>Course Name:</strong> ${course}</p>
          <hr>
          ${summaryDiv.innerHTML}
          <div style="margin-top:20px; text-align:center;">
            <h3>Final Continuous Assessment: ${caProgress.textContent}</h3>
            <p>${statusText.textContent}</p>
          </div>
        </div>
      `;

      html2pdf().set({
        margin: 0.5,
        filename: `${student}_${course}_CA_Report.pdf`,
        html2canvas: { scale: 2 },
        jsPDF: { orientation: 'portrait' },
      }).from(element).save();
    });
  </script>
</body>

</html>
